[env:esp32-s3-cam]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; 硬件配置
board_build.flash_mode = qio
board_upload.flash_size = 16MB

; SPIFFS 文件系统配置
board_build.filesystem = spiffs
board_build.partitions = default.csv
board_upload.offset = 0x0

; 构建标志 - 禁用IDE误报警告
build_flags =
    -Wno-implicit-function-declaration
    -Wno-deprecated-declarations
    -DCONFIG_ESP32_CAMERA_ENABLED=1

; ESP-IDF 外部组件路径
board_build.esp-idf.components = 
    esp_wifi
    esp_netif
    lwip
    nvs_flash
    esp_http_server
    esp_timer
    freertos
    fatfs
    spiffs
    esp_adc
    driver
    mbedtls
    components/esp32-camera
    components/cjson
    src/audio
    src/video
    src/sdcard
    src/sensors
    src/actuators
