[env:esp32-s3-cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 115200
board_build.mcu = esp32s3
board_build.f_flash = 80000000L
board_build.flash_size = 8MB
board_build.flash_mode = qio

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.data_dir = data/web
board_build.core = esp32
board_build.language = en
board_build.exception = disabled
board_build.filesystem = littlefs


build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_ESP32_CAMERA_ENABLED=1
    -DCONFIG_SCCB_CLK_FREQ=100000
    -Wno-error
    -DCONFIG_HTTPD_MAX_URI_HANDLERS=128
    -DCONFIG_HTTPD_WS_SUPPORT=1
    -UCONFIG_FATFS_CODEPAGE
    -UCONFIG_FATFS_CODEPAGE_437
    -UCONFIG_FATFS_API_ENCODING_ANSI_OEM
    -DCONFIG_FATFS_CODEPAGE_936=1
    -DCONFIG_FATFS_CODEPAGE=936
    -DCONFIG_FATFS_API_ENCODING_UTF_8=1
    ; LittleFS Configuration
    -DCONFIG_LITTLEFS=y
    -DCONFIG_LITTLEFS_MAX_PARTITIONS=3
    -DCONFIG_LITTLEFS_PAGE_SIZE=256
    -DCONFIG_LITTLEFS_OBJ_NAME_LEN=64
    -DCONFIG_LITTLEFS_READ_SIZE=256
    -DCONFIG_LITTLEFS_WRITE_SIZE=256
    -DCONFIG_LITTLEFS_LOOKAHEAD_SIZE=128
    -DCONFIG_LITTLEFS_CACHE_SIZE=512
    -DCONFIG_LITTLEFS_BLOCK_CYCLES=512
    -DCONFIG_LITTLEFS_PARTITION_LABEL=\"webfs\"
    -DCONFIG_LWIP_MAX_SOCKETS=16
    -DCONFIG_FS_MAX_FILE_NUM=16
    -Icomponents/esp_littlefs/include

build_unflags =
    -Werror

lib_ldf_mode = chain