<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 智能水泵控制</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
        }
        h1 { color: #333; margin-bottom: 20px; font-size: 24px; }
        h2 { color: #667eea; margin-bottom: 15px; font-size: 18px; }
        p { color: #666; margin-bottom: 15px; line-height: 1.6; }
        .info-box {
            background: #f0f4ff;
            border: 1px solid #d0d9ff;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
        }
        .info-box h3 {
            color: #667eea;
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        .info-box ul {
            margin: 0;
            padding-left: 20px;
            color: #555;
            font-size: 14px;
        }
        .info-box li {
            margin: 5px 0;
        }
        a.btn {
            display: inline-block;
            margin-top: 15px;
            padding: 15px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
        }
        a.btn:hover { background: #5568d3; }
        .manual-link {
            display: block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #f8f9fa;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
        }
        .manual-link:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }
        .countdown {
            font-size: 14px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ESP32-S3 智能水泵控制系统</h1>
        <h2>欢迎连接Wi-Fi热点</h2>
        
        <p>页面将自动跳转到控制面板</p>
        <p class="countdown">如果没有自动跳转，请在下方手动打开</p>
        
        <a class="btn" href="http://192.168.8.8">打开控制面板</a>
        
        <div class="info-box">
            <h3>提示</h3>
            <ul>
                <li><strong>控制面板地址：</strong>192.168.8.8</li>
                <li><strong>AP热点名称：</strong>myEsp</li>
                <li><strong>AP密码：</strong>88888888</li>
            </ul>
        </div>
        
        <div class="info-box">
            <h3>Captive Portal 未弹出？</h3>
            <ul>
                <li>iOS: 设置 > 无线局域网 > 点击"myEsp"旁的ⓘ > "自动加入"关闭再打开</li>
                <li>Android: 设置 > 网络 > 高级 > 忘记网络后重新连接</li>
                <li>Windows: 设置 > 网络 > 忘记"myEsp"后重新连接</li>
            </ul>
        </div>
        
        <a class="manual-link" href="http://192.168.8.8">手动访问控制面板 →</a>
    </div>
    
    <script>
        // 延迟2秒后自动跳转
        setTimeout(function() {
            window.location.href = 'http://192.168.8.8';
        }, 2000);
    </script>
</body>
</html>
